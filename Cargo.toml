[package]
name = "dungeon-floorbreak"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "dungeon-floorbreak"

[dependencies]
bevy = { version = "=0.20.1", default-features = false, features = ["2d", "bevy_audio", "vorbis"] }
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }

# Test-only: parses the lighting shader to prove its Params block matches the
# Rust uniform layout. Already in Cargo.lock through wgpu (same version, no new crate).
[dev-dependencies]
naga = { version = "=30.0.2", default-features = false, features = ["wgsl-in"] }

[profile.dev]
opt-level = 1

