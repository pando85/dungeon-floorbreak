name: floor01-setup
description: >-
  Toolchain, dependency cache, Linux render dependencies and the exported actor
  and Floor 1 kit atlases, shared by every job of the floor01-scene workflow
  (the same steps, in the same order, as the original single job).
inputs:
  save-cache:
    description: Whether this job saves the cargo cache when it finishes.
    default: 'true'
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    # Same shared key as game.yml and character-playground.yml, so the
    # workflows reuse one dependency build. fmt, clippy and the Rust tests
    # (including every floor01 test) run in game.yml.
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: bevy-linux-dev
        save-if: ${{ inputs.save-cache }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install Linux render dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          pkg-config libasound2-dev libudev-dev \
          libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxkbcommon-dev libxkbcommon-x11-0 \
          libwayland-dev libvulkan-dev mesa-vulkan-drivers \
          xvfb x11-utils imagemagick
        python3 -m pip install --disable-pip-version-check Pillow==13.0.0 numpy==2.5.3
    - name: Obtain pinned LibreSprite 1.3
      shell: bash
      run: |
        set -euo pipefail
        curl --fail --location --retry 4 --retry-all-errors --silent --show-error \
          -o "$RUNNER_TEMP/libresprite.AppImage" \
          'https://github.com/LibreSprite/LibreSprite/releases/download/v1.3/libresprite-v1.3-linux-x86_64.AppImage'
        echo 'fd90bddda8135fe00f4a9a9c8c9ebd48f9b07e8782ab269be5c9efb1a851af30  '"$RUNNER_TEMP/libresprite.AppImage" | sha256sum -c -
        mkdir -p "$RUNNER_TEMP/art-cli"
        cd "$RUNNER_TEMP/art-cli"
        chmod +x "$RUNNER_TEMP/libresprite.AppImage"
        "$RUNNER_TEMP/libresprite.AppImage" --appimage-extract >/dev/null
        echo "ART_CLI=$RUNNER_TEMP/art-cli/squashfs-root/AppRun" >> "$GITHUB_ENV"
    - name: Export actor and Floor 1 kit atlases
      shell: bash
      run: bash scripts/export_assets.sh
