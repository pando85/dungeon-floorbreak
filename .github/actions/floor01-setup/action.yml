name: floor01-setup
description: >-
  Toolchain, dependency cache, Linux render dependencies and the exported actor
  and Floor 1 kit atlases, shared by every job of the floor01-scene workflow.
  CI-SPEED-01: the Rust toolchain and the runtime half (render tools, Python,
  LibreSprite, atlas export) can be switched off independently, so the single
  build job only compiles and the capture jobs only run the prebuilt binary.
  Every network step is retried a bounded number of times.
inputs:
  save-cache:
    description: Whether this job saves the cargo cache when it finishes.
    default: 'true'
  rust:
    description: Install the Rust toolchain and restore the cargo cache.
    default: 'true'
  runtime:
    description: >-
      Install the render and Python tooling, obtain LibreSprite and export the
      actor and Floor 1 kit atlases (everything the render scripts need).
    default: 'true'
  download-binary:
    description: >-
      Download the floor01_scene binary built by the build job into
      target/debug, where the CI scripts expect it.
    default: 'false'
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      if: inputs.rust == 'true'
      with:
        components: rustfmt, clippy
    # Same shared key as game.yml and character-playground.yml, so the
    # workflows reuse one dependency build. fmt, clippy and the Rust tests
    # (including every floor01 test) run in game.yml.
    - uses: Swatinem/rust-cache@v2
      if: inputs.rust == 'true'
      with:
        shared-key: bevy-linux-dev
        save-if: ${{ inputs.save-cache }}
    - uses: actions/setup-python@v5
      if: inputs.runtime == 'true'
      with:
        python-version: '3.12'
    # Bounded retry for the network-dependent steps (apt mirrors, pip, the
    # LibreSprite download): up to 3 attempts, each capped by a timeout so a
    # hung mirror is killed and retried instead of stalling the job. Fails the
    # step after the last attempt (a real error is still an error).
    - name: Install Linux build dependencies
      shell: bash
      run: |
        set -uo pipefail
        retry() {
          local n=1
          until "$@"; do
            if (( n >= 3 )); then
              echo "::error::'$*' failed after $n attempts" >&2
              return 1
            fi
            echo "::warning::attempt $n of '$*' failed or timed out; retrying in $((n * 15))s" >&2
            sudo dpkg --configure -a || true
            sleep $((n * 15))
            n=$((n + 1))
          done
        }
        pkgs=(pkg-config libasound2-dev libudev-dev
          libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxkbcommon-dev libxkbcommon-x11-0
          libwayland-dev libvulkan-dev)
        if [ '${{ inputs.runtime }}' = 'true' ]; then
          pkgs+=(mesa-vulkan-drivers xvfb x11-utils imagemagick)
        fi
        retry sudo timeout 300 apt-get -o Acquire::Retries=3 update || exit 1
        retry sudo timeout 600 apt-get -o Acquire::Retries=3 install -y --no-install-recommends "${pkgs[@]}" || exit 1
        if [ '${{ inputs.runtime }}' = 'true' ]; then
          retry timeout 300 python3 -m pip install --disable-pip-version-check Pillow==13.0.0 numpy==2.5.3 || exit 1
        fi
    - name: Obtain pinned LibreSprite 1.3
      if: inputs.runtime == 'true'
      shell: bash
      run: |
        set -uo pipefail
        fetch() {
          rm -f "$RUNNER_TEMP/libresprite.AppImage" &&
          timeout 300 curl --fail --location --retry 4 --retry-all-errors --silent --show-error \
            -o "$RUNNER_TEMP/libresprite.AppImage" \
            'https://github.com/LibreSprite/LibreSprite/releases/download/v1.3/libresprite-v1.3-linux-x86_64.AppImage' &&
          echo 'fd90bddda8135fe00f4a9a9c8c9ebd48f9b07e8782ab269be5c9efb1a851af30  '"$RUNNER_TEMP/libresprite.AppImage" | sha256sum -c -
        }
        n=1
        until fetch; do
          if (( n >= 3 )); then
            echo "::error::LibreSprite download failed after $n attempts" >&2
            exit 1
          fi
          echo "::warning::LibreSprite download attempt $n failed; retrying in $((n * 15))s" >&2
          sleep $((n * 15))
          n=$((n + 1))
        done
        set -e
        mkdir -p "$RUNNER_TEMP/art-cli"
        cd "$RUNNER_TEMP/art-cli"
        chmod +x "$RUNNER_TEMP/libresprite.AppImage"
        "$RUNNER_TEMP/libresprite.AppImage" --appimage-extract >/dev/null
        echo "ART_CLI=$RUNNER_TEMP/art-cli/squashfs-root/AppRun" >> "$GITHUB_ENV"
    - name: Export actor and Floor 1 kit atlases
      if: inputs.runtime == 'true'
      shell: bash
      run: bash scripts/export_assets.sh
    - name: Download the prebuilt floor01_scene binary
      if: inputs.download-binary == 'true'
      uses: actions/download-artifact@v4
      with:
        name: floor01-scene-bin
        path: target/debug
    - name: Make the prebuilt binary executable
      if: inputs.download-binary == 'true'
      shell: bash
      run: chmod +x target/debug/floor01_scene && ls -l target/debug/floor01_scene
