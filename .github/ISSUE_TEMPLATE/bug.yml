name: Gameplay or pipeline bug
description: Reproducible defect report with deterministic evidence
labels: [bug]
body:
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Include steps, seed, level, game version and input replay when possible.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots and environment
      description: Platform, GPU, resolution, trace, gif and performance metrics.
