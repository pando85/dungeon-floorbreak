name: art-assets
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: art-assets-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  export-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python image validator dependency
        run: python3 -m pip install --disable-pip-version-check Pillow==13.0.0
      - name: Obtain LibreSprite 1.3 (pinned official release and SHA-256)
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors --silent --show-error \
            -o "$RUNNER_TEMP/libresprite.AppImage" \
            'https://github.com/LibreSprite/LibreSprite/releases/download/v1.3/libresprite-v1.3-linux-x86_64.AppImage'
          echo 'fd90bddda8135fe00f4a9a9c8c9ebd48f9b07e8782ab269be5c9efb1a851af30  '"$RUNNER_TEMP/libresprite.AppImage" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/art-cli"
          cd "$RUNNER_TEMP/art-cli"
          chmod +x "$RUNNER_TEMP/libresprite.AppImage"
          "$RUNNER_TEMP/libresprite.AppImage" --appimage-extract >/dev/null
          echo "ART_CLI=$RUNNER_TEMP/art-cli/squashfs-root/AppRun" >> "$GITHUB_ENV"
      - name: Export Aseprite-compatible masters and validate
        run: bash scripts/export_assets.sh
      - name: Regression tests (including rejection of bad metadata)
        run: python3 -m unittest discover -s tests -p 'test_art_*.py' -v
      - name: Re-export must be byte-identical
        run: |
          sha256sum generated/art/*.png generated/art/*.json > "$RUNNER_TEMP/first.sha256"
          bash scripts/export_assets.sh
          sha256sum -c "$RUNNER_TEMP/first.sha256"
      - name: Check repo documentation and rights records
        run: python3 scripts/check_docs.py
      - name: Publish native-scale visual review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: art-work008-review
          path: |
            generated/art/
          if-no-files-found: warn
