name: floor01-scene
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: floor01-scene-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  corridor-scene:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
      WGPU_BACKEND: vulkan
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Same shared key as game.yml and character-playground.yml, so the three
      # workflows reuse one dependency build. fmt, clippy and the Rust tests
      # (including every floor01 test) run in game.yml.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bevy-linux-dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev \
            libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libwayland-dev libvulkan-dev mesa-vulkan-drivers \
            xvfb x11-utils imagemagick
          python3 -m pip install --disable-pip-version-check Pillow==13.0.0 numpy==2.5.3
      - name: Obtain pinned LibreSprite 1.3
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors --silent --show-error \
            -o "$RUNNER_TEMP/libresprite.AppImage" \
            'https://github.com/LibreSprite/LibreSprite/releases/download/v1.3/libresprite-v1.3-linux-x86_64.AppImage'
          echo 'fd90bddda8135fe00f4a9a9c8c9ebd48f9b07e8782ab269be5c9efb1a851af30  '"$RUNNER_TEMP/libresprite.AppImage" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/art-cli"
          cd "$RUNNER_TEMP/art-cli"
          chmod +x "$RUNNER_TEMP/libresprite.AppImage"
          "$RUNNER_TEMP/libresprite.AppImage" --appimage-extract >/dev/null
          echo "ART_CLI=$RUNNER_TEMP/art-cli/squashfs-root/AppRun" >> "$GITHUB_ENV"
      - name: Export actor and Floor 1 kit atlases
        run: bash scripts/export_assets.sh
      - name: Check actor pivots, kit atlases and layout against the contract
        run: python3 scripts/check_floor01_scene_contract.py
      - name: Exported atlas JSON must equal the committed grid sources (fails instead of skipping)
        env:
          REQUIRE_EXPORTED_ATLAS: '1'
        run: cargo test --locked --lib exported_atlas_json_matches_the_grid_source_when_present
      - name: Negative tests for the scene contract checker
        run: python3 -m unittest discover -s tests -p 'test_floor01_scene_*.py' -v
      - name: Compile the Floor 1 scene
        run: cargo build --locked --bin floor01_scene
      - name: Headless corridor smoke (no GPU)
        run: ./target/debug/floor01_scene --headless-floor01-smoke --scenario walk_right --capture-tick 250
      - name: Real Bevy render, primary 1920x1080 (3x), lighting on
        run: xvfb-run -a -s '-screen 0 1920x1080x24' bash scripts/ci_floor01_render_smoke.sh desktop
      - name: Real Bevy render at 1280x720 (2x)
        run: xvfb-run -a -s '-screen 0 1280x720x24' bash scripts/ci_floor01_render_smoke.sh desktop-720
      - name: Real Bevy render at 640x400 virtual pixels (Deck framing)
        run: xvfb-run -a -s '-screen 0 1280x800x24' bash scripts/ci_floor01_render_smoke.sh deck
      - name: Scripted capture inside the B and C segments (640x360)
        run: xvfb-run -a -s '-screen 0 1280x720x24' bash scripts/ci_floor01_render_smoke.sh advanced
      - name: Scripted capture inside the B and C segments (640x400)
        run: xvfb-run -a -s '-screen 0 1280x800x24' bash scripts/ci_floor01_render_smoke.sh advanced-deck
      - name: Lighting off (COMP-01 look), 1920x1080, must differ from lit
        run: xvfb-run -a -s '-screen 0 1920x1080x24' bash scripts/ci_floor01_render_smoke.sh nolight
      - name: Lighting off, frozen capture (same state line as the lit capture)
        run: xvfb-run -a -s '-screen 0 1280x720x24' bash scripts/ci_floor01_render_smoke.sh nolight-advanced
      - name: Live run, lighting systems active (250 scripted ticks in the render loop)
        run: xvfb-run -a -s '-screen 0 1280x720x24' bash scripts/ci_floor01_render_smoke.sh live-lit
      - name: Live run, --no-lighting; final state must equal the lit run and the headless sim
        run: xvfb-run -a -s '-screen 0 1280x720x24' bash scripts/ci_floor01_render_smoke.sh live-unlit
      - name: Reference frame (ENV-01 lit preview pose) at 1920x1080
        run: xvfb-run -a -s '-screen 0 1920x1080x24' bash scripts/ci_floor01_render_smoke.sh reference
      - name: Compare the Bevy reference frame with the Pillow reference model (gated)
        run: |
          python3 scripts/compare_floor01_lighting.py \
            --bevy artifacts/floor01-scene-reference-1920x1080.png \
            --pillow docs/evidence/floor01-catacomb-kit/lit_abc_1920x1080_x3.png \
            --out-image artifacts/floor01-lighting-bevy-vs-pillow.png \
            --out-json artifacts/floor01-lighting-compare.json
      - name: Collision and walking-line overlay (640x360)
        run: xvfb-run -a -s '-screen 0 1280x720x24' bash scripts/ci_floor01_render_smoke.sh collision
      - name: HUD-HYBRID-A-01 captures at 640x360 (normal, five preview fixtures, real hurt and notices; pixel-integrity checked)
        run: xvfb-run -a -s '-screen 0 1280x720x24' bash scripts/ci_floor01_render_smoke.sh hud
      - name: HUD-HYBRID-A-01 captures at 640x400 (Deck framing)
        run: xvfb-run -a -s '-screen 0 1280x800x24' bash scripts/ci_floor01_render_smoke.sh hud-deck
      - name: Animation capture, run_jump scenario (81 real 1920x1080 Bevy frames, state must match the headless run)
        run: xvfb-run -a -s '-screen 0 1920x1080x24' bash scripts/ci_floor01_render_smoke.sh anim-sequence
      - name: ANIM-INT-01 evidence (GIF, stills, timeline) and committed state logs
        run: |
          python3 scripts/make_anim_int_evidence.py \
            --frames artifacts/anim-int-01/frames \
            --log artifacts/floor01-scene-anim-sequence-1920x1080.log \
            --trace artifacts/anim-int-01/anim_trace_full.txt \
            --out artifacts/anim-int-01/evidence \
            --strip takeoff=artifacts/anim-int-01/frames_takeoff:artifacts/anim-int-01/strip_takeoff.log \
            --strip landing=artifacts/anim-int-01/frames_landing:artifacts/anim-int-01/strip_landing.log
          # The per-tick animation trace and the per-capture state lines are
          # deterministic: this runner must reproduce the committed ones exactly.
          diff docs/evidence/anim-int-01/anim_trace.txt artifacts/anim-int-01/evidence/anim_trace.txt
          diff docs/evidence/anim-int-01/capture_log.txt artifacts/anim-int-01/evidence/capture_log.txt
          diff docs/evidence/anim-int-01/capture_log_strip_takeoff.txt artifacts/anim-int-01/evidence/capture_log_strip_takeoff.txt
          diff docs/evidence/anim-int-01/capture_log_strip_landing.txt artifacts/anim-int-01/evidence/capture_log_strip_landing.txt
      - name: Combat fixtures, headless replays (must equal the committed logs and anim traces and be deterministic)
        run: bash scripts/ci_floor01_combat.sh headless
      - name: Combat fixtures, real Bevy 1920x1080 loop (must reproduce the headless events and hash) and CP-01 and ART-INT-02 captures
        run: xvfb-run -a -s '-screen 0 1920x1080x24' bash scripts/ci_floor01_combat.sh render
      - name: DEMO-01 autopilot probes, headless (must equal the committed logs, be deterministic and identical at gore presets 1 to 4)
        run: bash scripts/ci_floor01_combat.sh demo
      - name: DEMO-01 whole route, real Bevy 1920x1080 loop (must reproduce the committed events and hash)
        run: xvfb-run -a -s '-screen 0 1920x1080x24' bash scripts/ci_floor01_combat.sh demo-render
      - name: Frame-interval probe, lighting on (software Vulkan, report only)
        continue-on-error: true
        run: xvfb-run -a -s '-screen 0 1280x720x24' bash scripts/ci_floor01_render_smoke.sh perf-lit
      - name: Frame-interval probe, lighting off (report only)
        continue-on-error: true
        run: xvfb-run -a -s '-screen 0 1280x720x24' bash scripts/ci_floor01_render_smoke.sh perf-unlit
      - name: Documentation checks
        run: python3 scripts/check_docs.py
      - name: Upload Floor 1 scene evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: the-crawl-floor01-scene
          path: |
            artifacts/floor01-scene-*.png
            artifacts/floor01-scene-*.log
            artifacts/floor01-lighting-*
            artifacts/hud/
            artifacts/anim-int-01/evidence/
            artifacts/cp01-feel/*.txt
            artifacts/cp01-feel/*.log
            artifacts/cp01-feel/frames_*/
          if-no-files-found: warn
