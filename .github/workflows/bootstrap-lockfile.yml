name: one-shot-lockfile-bootstrap
on:
  push:
    branches:
      - feat/work-001-bevy-linux-foundation
permissions:
  contents: write
jobs:
  generate-and-commit:
    if: github.event.head_commit.message == 'ci: bootstrap Cargo.lock from GitHub Actions'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/work-001-bevy-linux-foundation
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate reproducible dependency lockfile
        run: cargo generate-lockfile
      - name: Commit lockfile and remove temporary write-permission workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git rm .github/workflows/bootstrap-lockfile.yml
          git commit -m "build: commit generated Cargo.lock"
          git push origin HEAD:refs/heads/feat/work-001-bevy-linux-foundation
