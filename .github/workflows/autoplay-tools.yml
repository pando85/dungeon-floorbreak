# AUTOPLAY-01C opt-in tooling job (AP-Q20). Not a required check.
# Builds the standalone PyO3 package, runs fmt, clippy and the Python tests.
# Also builds the native autoplay CLI and verifies Python-written replays with it.
# No torch and no Stable-Baselines3 here: PPO runs locally only.
name: autoplay-tools
on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/autoplay/**'
      - 'tools/autoplay/**'
      - '.github/workflows/autoplay-tools.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: autoplay-tools-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  python-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/autoplay/native
          shared-key: autoplay-native
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev \
            libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libwayland-dev libvulkan-dev
      - name: Native package fmt and clippy (release profile shared with the wheel build; root checks do not cover this package)
        working-directory: tools/autoplay/native
        run: |
          cargo fmt --check
          cargo clippy --release --locked --all-targets -- -D warnings
      - name: Native package tests (Python-free bridge helpers)
        working-directory: tools/autoplay/native
        run: cargo test --release --locked
      - name: Install pinned build tooling
        run: python -m pip install --disable-pip-version-check maturin==1.16.0
      - name: Build the wheel
        working-directory: tools/autoplay
        run: maturin build --release --locked --manifest-path native/Cargo.toml --out dist
      - name: Install the wheel and the pinned test dependencies
        working-directory: tools/autoplay
        run: python -m pip install --disable-pip-version-check dist/*.whl gymnasium==1.4.0 numpy==2.5.4 pytest==9.2.0
      - name: Build the native autoplay CLI (shares the native target dir, so Bevy compiles once)
        run: |
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/tools/autoplay/native/target" \
            cargo build --release --locked --bin autoplay
      - name: Root dependency isolation (no PyO3 or NumPy in the game's cargo tree)
        run: |
          if cargo tree --locked | grep -Ei 'pyo3|numpy|ndarray'; then
            echo "PyO3/NumPy leaked into the root dependency tree" >&2
            exit 1
          fi
      - name: Python tests from outside the source tree (check_env, determinism, terminal, parity, native replay verify)
        env:
          AUTOPLAY_TEST_INSTALLED: '1'
          AUTOPLAY_REQUIRE_CLI: '1'
        run: |
          scratch="$(mktemp -d)"
          cd "$scratch"
          AUTOPLAY_CLI="$GITHUB_WORKSPACE/tools/autoplay/native/target/release/autoplay" \
            python -m pytest "$GITHUB_WORKSPACE/tools/autoplay/tests" -q
      - name: check_env CLI, native-bot baseline evaluation and native replay verify
        run: |
          scratch="$(mktemp -d)"
          cd "$scratch"
          python -m autoplay check-env
          python -m autoplay evaluate --scenario cp01_single_goblin --policy reactive_survivor \
            --episodes 10 --seed 42 --out "$scratch/eval"
          "$GITHUB_WORKSPACE/tools/autoplay/native/target/release/autoplay" replay \
            --episode "$scratch/eval/replays/cp01_single_goblin/reactive_survivor/episode_0001.jsonl" \
            --verify --assets-root "$GITHUB_WORKSPACE"
